name: Board refresh

# Pulls OHLCV for every ticker in data.js after the US close, recomputes every
# indicator the cards quote, and audits each card's `lead` against the fresh
# price. It NEVER edits data.js — judgement calls stay human. The report goes to
# the run summary and, on a schedule, to a long-lived PR so the numbers arrive
# as a notification instead of a chore.
#
# THIS BOT DOES NOT COMMIT unless asked. It reports, and it can re-cut each
# deck's ТУТ ladder rung — pure arithmetic off data.js (close, day %, date,
# entry zone) — but that re-cut now ships as a PATCH inside the run artifact,
# not as a commit. Nothing reaches the repository until a human has read the
# numbers and re-run with apply=true.

on:
  schedule:
    # 21:30 UTC on weekdays. Deliberately DST-proof: 17:30 ET in summer,
    # 16:30 ET in winter — always after the 16:00 ET close.
    - cron: '30 21 * * 1-5'
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Space-separated tickers (blank = every ticker in data.js)'
        required: false
        default: ''
      source:
        description: 'Data source'
        required: false
        default: 'yahoo'
        type: choice
        options: [yahoo, stooq]
      apply:
        description: 'COMMIT the report and any rung re-cut to a PR (default: artifact only)'
        required: false
        default: false
        type: boolean
      fix_rungs:
        description: "Compute the ТУТ rung re-cut (shipped as a patch, applied only with apply=true)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: board-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A healthy run is ~25 s end to end, so ten minutes is a ceiling nothing
    # legitimate reaches — it exists to cap a feed that accepts the connection
    # and then stalls, which the 30 s per-request timeout does not bound in
    # aggregate. Without it the job inherits the 6-HOUR default and a single
    # wedged fetch quietly spends a day's worth of Actions minutes.
    #
    # ⚠️ This does NOT cover time spent waiting for a runner: the clock starts
    # when the job is assigned one. Two manual runs on 2026-08-06 were killed
    # after 15 minutes having never been assigned (runner_id 0, zero steps
    # executed) — that is GitHub-side capacity, and no workflow setting reaches
    # it. Do not raise or lower this number in response to a queueing problem.
    timeout-minutes: 10
    steps:
      # Node20 is EOL and runners default to Node24 since 2026-06-16, so the
      # JavaScript actions here are pinned to majors built for Node24. Do NOT
      # set ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION — that is the opt-OUT, and
      # it only works until Node20 is removed from the runner image.
      # The rest of this job is plain python3/bash/git/gh, which the Node
      # migration does not touch at all.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Refresh and audit
        id: run
        env:
          TICKERS: ${{ inputs.tickers }}
          SOURCE: ${{ inputs.source || 'yahoo' }}
          # Default ON: a blank input on the cron schedule must still re-cut.
          FIX_RUNGS: ${{ inputs.fix_rungs == false && 'no' || 'yes' }}
        run: |
          set -uo pipefail
          mkdir -p tools/reports
          [ "$FIX_RUNGS" = yes ] && FIX=--fix-rungs || FIX=
          # A single bad ticker must not fail the run — refresh.py logs
          # per-ticker failures to stderr and carries on.
          python3 tools/refresh.py $TICKERS \
            --source "$SOURCE" $FIX \
            --out tools/reports/latest.txt 2> tools/reports/errors.txt || true
          # Did the re-cut touch any deck? The PR step needs to know whether to
          # carry deck files alongside the report.
          if [ -n "$(git status --porcelain stories/)" ]; then
            echo "recut=true" >> "$GITHUB_OUTPUT"
            echo "recut_n=$(git status --porcelain stories/ | wc -l)" >> "$GITHUB_OUTPUT"
          fi
          # Fall back to the offline audit so a data outage still says something.
          if [ ! -s tools/reports/latest.txt ]; then
            echo "fetch_failed=true" >> "$GITHUB_OUTPUT"
            python3 tools/refresh.py --audit-only --out tools/reports/latest.txt || true
          fi
          FINDINGS=$(grep -cE '^  [A-Z]{2,5}:' tools/reports/latest.txt || true)
          echo "findings=${FINDINGS:-0}" >> "$GITHUB_OUTPUT"
          # Stash both: the PR step checks out another branch over the worktree.
          cp tools/reports/latest.txt "$RUNNER_TEMP/latest.txt"
          git diff -- stories/ > "$RUNNER_TEMP/rungs.patch" || true
          # Ship the re-cut as a reviewable patch and put the decks back. A
          # scheduled run must leave the worktree exactly as it checked out.
          cp "$RUNNER_TEMP/rungs.patch" tools/reports/rungs.patch || true
          git checkout -- stories/ || true

      - name: Write run summary
        run: |
          {
            echo "## Board refresh — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            if [ "${{ inputs.apply }}" != "true" ]; then
              echo "_Nothing committed._ Report and any rung patch are in the "
              echo "\`board-report\` artifact. Re-run with **apply=true** to commit."
              echo
            fi
            echo "Source \`${{ inputs.source || 'yahoo' }}\` · audit findings **${{ steps.run.outputs.findings }}**"
            if [ "${{ steps.run.outputs.recut }}" = true ]; then
              echo " · ТУТ rungs re-cut in **${{ steps.run.outputs.recut_n }}** deck(s)"
            fi
            echo
            if [ -s tools/reports/errors.txt ]; then
              echo "<details><summary>Fetch warnings</summary>"
              echo
              echo '```'
              cat tools/reports/errors.txt
              echo '```'
              echo "</details>"
              echo
            fi
            echo '```'
            cat tools/reports/latest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # v5 runs on Node24. v4 is Node20-based and emits the EOL deprecation
      # warning — harmless until Node20 leaves the runner image in the autumn,
      # but there is no reason to carry it. If this ever fails to resolve, drop
      # back to @v4: the error is immediate and unmistakable.
      - uses: actions/upload-artifact@v5
        with:
          name: board-report
          path: tools/reports/
          retention-days: 30

      # Opt-in only. Never fires on the schedule: `inputs.apply` is unset there,
      # so a scheduled run can only ever produce an artifact to review.
      - name: Open or update the report PR
        if: inputs.apply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          BRANCH=bot/board-refresh

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Start the branch from the base each time: the report is a snapshot,
          # not history worth accumulating.
          git checkout -f -B "$BRANCH" "origin/$BASE"
          mkdir -p tools/reports
          cp "$RUNNER_TEMP/latest.txt" tools/reports/latest.txt

          # Replay the ТУТ re-cut on top of the freshly checked-out base. If a
          # deck moved on the base since the fetch, the patch simply does not
          # apply — the report still ships, and the next run re-cuts.
          if [ -s "$RUNNER_TEMP/rungs.patch" ]; then
            git apply "$RUNNER_TEMP/rungs.patch" \
              || echo "— rung patch did not apply to $BASE; report only this run."
            git add stories/
          fi

          git add -f tools/reports/latest.txt
          if git diff --cached --quiet; then
            echo "Report identical to base — nothing to open (likely a market holiday)."
            exit 0
          fi

          RUNGS=""
          [ "${{ steps.run.outputs.recut }}" = true ] &&
            RUNGS=" · ${{ steps.run.outputs.recut_n }} ТУТ rung(s) re-cut to the close"
          git commit -q -m "Board refresh $(date -u '+%Y-%m-%d') — ${{ steps.run.outputs.findings }} audit finding(s)${RUNGS}"
          git push -q -f -u origin "$BRANCH"

          OPEN=$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number' | head -1)
          if [ -z "$OPEN" ]; then
            gh pr create --base "$BASE" --head "$BRANCH" \
              --title "Board refresh — recomputed numbers and card audit" \
              --body-file .github/board-refresh-pr-body.md
          else
            echo "PR #$OPEN already open — force-pushed the new report to it."
          fi
